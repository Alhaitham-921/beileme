name: ${COMPOSE_PROJECT_NAME:-beileme}

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-beileme}
      MYSQL_USER: ${DB_USER:-beileme}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Generate deploy/.env first}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Generate deploy/.env first}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 1536m
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - deploy/api.env
    environment:
      NODE_ENV: production
      PORT: "3002"
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-beileme}
      DB_USER: ${DB_USER:-beileme}
      DB_PASSWORD: ${DB_PASSWORD:?Generate deploy/.env first}
      JWT_SECRET: ${JWT_SECRET:?Generate deploy/.env first}
      AI_KEY_ENCRYPTION_SECRET: ${AI_KEY_ENCRYPTION_SECRET:?Generate deploy/.env first}
      CORS_ORIGIN: "${PUBLIC_ORIGIN:-http://localhost:8088},https://localhost,${EXTRA_CORS_ORIGINS:-}"
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com/v1}
      AI_DEFAULT_MODEL: ${AI_DEFAULT_MODEL:-deepseek-v4-pro}
      WORD_IMAGE_API_KEY: ${WORD_IMAGE_API_KEY:-}
      WORD_IMAGE_BASE_URL: ${WORD_IMAGE_BASE_URL:-}
      WORD_IMAGE_MODEL: ${WORD_IMAGE_MODEL:-}
      WORD_IMAGE_DAILY_QUOTA: ${WORD_IMAGE_DAILY_QUOTA:-5}
      SPEECH_API_KEY: ${SPEECH_API_KEY:-}
      SPEECH_BASE_URL: ${SPEECH_BASE_URL:-https://api.siliconflow.cn/v1}
      SPEECH_MODEL: ${SPEECH_MODEL:-FunAudioLLM/SenseVoiceSmall}
      SMTP_HOST: ${SMTP_HOST:-smtp.qq.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-背了么}
      KOKORO_URL: http://kokoro:3003/synthesize
      IELTS_MEDIA_DIR: /app/server/media
      FFPROBE_PATH: /usr/bin/ffprobe
      APP_TIMEZONE_OFFSET_MINUTES: "480"
    volumes:
      - wordlist_cache:/app/server/data/wordlists
      - ielts_media:/app/server/media
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    mem_limit: 768m
    logging: *logging

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 128m
    logging: *logging

  kokoro:
    build:
      context: .
      dockerfile: deploy/kokoro.Dockerfile
    restart: unless-stopped
    environment:
      KOKORO_BIND_HOST: 0.0.0.0
      KOKORO_MODEL_DIR: /models
      KOKORO_THREADS: ${KOKORO_THREADS:-2}
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:3003/health',timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 180s
    mem_limit: 1536m
    logging: *logging

volumes:
  mysql_data:
  wordlist_cache:
  ielts_media:
