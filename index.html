<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        const theme = localStorage.getItem('beileme.theme');
        if (['paper', 'frost', 'forest'].includes(theme)) {
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.backgroundColor = theme === 'frost' ? '#10141d' : theme === 'forest' ? '#f0f5ef' : '#faf6f0';
        }
      } catch (_) {}
    </script>
    <title>背了么 · 用单词，而不是背单词</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
